    patch:
      tags:
        - Consultations
      summary: Update consultation lifecycle state and clinical timestamps
      description: >-
        Permitted for the assigned doctor or an administrator. Enforces valid status state transitions
        (`booked` -> `confirmed`/`in_progress`/`cancelled`, `confirmed` -> `in_progress`, `in_progress` -> `completed`/`no_show`).
        Terminal statuses (`completed`, `cancelled`, `no_show`) cannot be modified.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          example: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [booked, confirmed, in_progress, completed, cancelled, no_show]
                  example: in_progress
                started_at:
                  type: string
                  format: date-time
                  example: '2026-11-15T09:05:00.000Z'
                ended_at:
                  type: string
                  format: date-time
                  example: '2026-11-15T09:35:00.000Z'
                notes:
                  type: string
                  maxLength: 2000
                  example: Patient responded favorably to initial Abhyanga assessment.
      responses:
        '200':
          description: Consultation lifecycle updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Consultation status updated
                  data:
                    type: object
                    properties:
                      consultation:
                        $ref: '#/components/schemas/Consultation'
        '400':
          description: Invalid status transition, inverted timestamps, or modifying terminal status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Only assigned doctor or admin can update consultation lifecycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

