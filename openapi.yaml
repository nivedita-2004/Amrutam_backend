components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Stateless JWT access token transmitted in Authorization header as 'Bearer <token>'.
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: Stateless JWT access token automatically transmitted in the HTTP-only 'accessToken' cookie.

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: Sita Sharma
        email:
          type: string
          format: email
          example: sita.sharma@example.com
        role:
          type: string
          enum: [patient, doctor, admin]
          example: patient
        status:
          type: string
          enum: [active, inactive, suspended]
          example: active
        created_at:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 10
        user_id:
          type: integer
          example: 10
        phone:
          type: string
          example: "+919876543210"
        date_of_birth:
          type: string
          format: date
          example: "1992-06-14"
        gender:
          type: string
          enum: [male, female, other, prefer_not_to_say]
          example: female
        address:
          type: string
          example: 42 Ayurveda Marg, Varanasi, UP
        emergency_contact:
          type: string
          example: "Ramesh Sharma: +919876500000"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserWithProfile:
      type: object
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: Sita Sharma
        email:
          type: string
          format: email
          example: sita.sharma@example.com
        role:
          type: string
          example: patient
        status:
          type: string
          example: active
        created_at:
