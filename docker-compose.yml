version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: amrutam_postgres_db
    environment:
      POSTGRES_DB: ${DOCKER_DB_NAME:-amrutam_db}
      POSTGRES_USER: ${DOCKER_DB_USER:-amrutam_dev_user}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:-amrutam_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_DB_USER:-amrutam_dev_user} -d ${DOCKER_DB_NAME:-amrutam_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - amrutam_net
    # Note: Port 5432 is not exposed to host to avoid collision with local Windows PostgreSQL service.
    # If host access to docker db is needed, map to alternate port like "5433:5432".

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amrutam_api
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DOCKER_DB_USER:-amrutam_dev_user}:${DOCKER_DB_PASSWORD:-amrutam_dev_password}@db:5432/${DOCKER_DB_NAME:-amrutam_db}
      DB_POOL_MAX: 10
      CORS_ORIGIN: "*"
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - amrutam_net

volumes:
  postgres_data:
    driver: local

networks:
  amrutam_net:
    driver: bridge
